<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table rendered in the browser console</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
 <section class="container">
     <h1>Multiplication Table Project</h1>
     <h3>Create your own Multiplication Table that is rendered with an HTML table!</h3>

     <div class="generate-box">
         <div class="inputs">
              <label for="rows">Rows:
                  <input id="rows" type="number" value="10" placeholder="How many rows?">
              </label>
             <label for="cols" >Columns:
                 <input id="cols" type="number" value="10" placeholder="How many cols?">
             </label>
        </div>
         <button id="generate" onclick="createWithHtmlTable(getRowsDesired(), getColumnsDesired())">Generate TABLE!</button>
     </div>

     <div id="output"></div>
 </section>

</body>
<script src="javascript.js" ></script>
</html>
